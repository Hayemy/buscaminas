<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscaminas</title>
<meta name="description" content="Buscaminas con tres niveles, cronómetro y una derrota muy poco amable.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/game.js" defer></script>
</head>
<body>

<h1>BUSCAMINAS</h1>

<div id="hud">
  <select id="nivel" aria-label="Nivel">
    <option value="facil">Fácil · 9×9 · 10 minas</option>
    <option value="medio">Medio · 16×16 · 40 minas</option>
    <option value="dificil">Difícil · 16×30 · 99 minas</option>
  </select>
  <span class="marcador" id="mMinas" aria-label="Minas restantes">💣 10</span>
  <span class="marcador" id="mTiempo" aria-label="Tiempo">⏱ 00:00</span>
  <button id="btnNuevo">Nuevo juego</button>
</div>

<main id="tablero"></main>
<p class="pista">Click = abrir · Click derecho (o mantener pulsado) = bandera 🚩</p>

<!-- derrota -->
<div id="caos" hidden>
  <div id="pila">
    <div id="burla"></div>
    <img id="foto" src="assets/img/gato.png" alt="">
    <div id="sub"></div>
    <button id="otra">JUGAR OTRA VEZ</button>
  </div>
</div>

<!-- victoria -->
<div id="gane" hidden>
  <h2>🎉 ¡GANASTE! 🎉</h2>
  <p id="ganeTiempo"></p>
  <button id="btnGane">Otra partida</button>
</div>

<footer>hecho para perder</footer>

</body>
</html>
